name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x64:
    name: Build x86_64 Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - name: Installa Inno Setup
        shell: pwsh
        run: |
          winget install JRSoftware.InnoSetup --source winget --accept-package-agreements --accept-source-agreements
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) {
            "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Rust Toolchain
        shell: pwsh
        run: |
          rustup show

      - name: Build e pacchettizzazione (cargo xtask dist)
        shell: pwsh
        run: |
          cargo build --release -p nextm
          cargo run -p xtask -- dist

      - name: Carica artefatti x64
        uses: actions/upload-artifact@v4
        with:
          name: dist-x64
          path: |
            target/dist/nextm-setup-*.exe
            target/dist/nextm-*-windows-x64.exe
            target/dist/nextm-*-windows-x64-portable.zip
            target/dist/SHA256SUMS.txt

  build-arm64:
    name: Build aarch64 Windows
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - name: Rust Toolchain ARM64
        shell: pwsh
        run: |
          rustup show

      - name: Compilazione nativa ARM64
        shell: pwsh
        run: |
          cargo build --release -p nextm

      - name: Prepara pacchetto ARM64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/dist-arm64 -Force
          Copy-Item target/release/nextm.exe target/dist-arm64/nextm-v0.1.0-windows-arm64.exe
          
          New-Item -ItemType Directory -Path target/_tmp_arm64 -Force
          Copy-Item target/release/nextm.exe target/_tmp_arm64/nextm.exe
          "# nextm portable configuration" | Out-File target/_tmp_arm64/nextm.ini -Encoding utf8
          Copy-Item README.md target/_tmp_arm64/
          Copy-Item LICENSE-MIT target/_tmp_arm64/
          Copy-Item LICENSE-APACHE target/_tmp_arm64/
          Compress-Archive -Path target/_tmp_arm64/* -DestinationPath target/dist-arm64/nextm-v0.1.0-windows-arm64-portable.zip -Force

      - name: Carica artefatti ARM64
        uses: actions/upload-artifact@v4
        with:
          name: dist-arm64
          path: target/dist-arm64/*

  publish-release:
    name: Pubblica GitHub Release
    needs: [build-x64, build-arm64]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - name: Scarica tutti gli artefatti
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Calcola SHA256 finale
        shell: pwsh
        run: |
          Remove-Item -Path release-assets/SHA256SUMS.txt -ErrorAction SilentlyContinue
          $hashes = Get-ChildItem -Path release-assets -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" }
          $hashes | Set-Content -Path release-assets/SHA256SUMS.txt -Encoding ascii
          Get-Content release-assets/SHA256SUMS.txt

      - name: Crea Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
